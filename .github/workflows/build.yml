name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug -PbuildNumber=${{ github.run_number }} --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk mochi-piano.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mochi-piano-apk
          path: mochi-piano.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mochi Piano 0.1.${{ github.run_number }}
          body: Install mochi-piano.apk on the phone. Each build installs over the previous one.
          files: mochi-piano.apk
          make_latest: true
